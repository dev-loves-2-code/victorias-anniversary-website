<script id="cfg" type="application/json">{"her":"Victoria","him":"Jonathan","date":"2025-11-13","song":{"url":"","title":"Our favourite song"},"sections":[{"id":"meet","show":true,"k":"The Boy from the Chemistry Laboratory 🧪❤️","t":"How It Began","x":"I remember meeting you for the first time in the chemistry lab during a practical. I approached you, asked for your number and I still remember you writing it down in my notebook.\n\nFunny how I thought I was just collecting a phone number, not knowing I was taking the first step towards finding someone who would become such a beautiful part of my life.\n\nAs fate would have it, we kept finding ourselves in the same places at the same time. UNIBEN somehow always managed to put us in the same groups for practicals and other school activities. Looking back, I think they played a little role in our story too, because what are the odds? \n\nWho knew that one little number would lead to a love story I’d never want to end?\n\nImagine collecting a phone number and accidentally collecting a lifetime of memories. ❤️","m":[{"type":"image","src":"https://ik.imagekit.io/sam10/assets/images/IMG_7399.JPG.jpeg","cap":"Where it all began.."}]},{"id":"date","show":true,"k":"the story of our friendship","t":"Just Two Best Friends 🤍","x":"Before we became us, we were simply two people who had grown comfortable being part of each other’s everyday lives.\n\nFrom showing up for lectures together to late-night study sessions, exam moments and those sleepovers at my place, we built a friendship that felt so natural. Somehow, having you around became a familiar part of my day and I couldn’t imagine those little routines without you.\n\nWe didn’t know it then, but perhaps love was already finding its way into the spaces between our friendship. We were busy enjoying each other’s company, completely unaware that we were building the foundation of something much bigger.\n\nWe called it friendship, but looking back, I think my heart was already getting used to having you around. ❤️","m":[{"type":"image","src":"https://ik.imagekit.io/sam10/assets/images/WhatsApp%20Image%202026-11-07%20at%2010.43.27%20PM.jpeg","cap":"I ❤️ this photo"},{"type":"video","src":"https://res.cloudinary.com/im1cmjhm/video/upload/v1794531054/IMG_7471.mp4","cap":"Just us being silly 😂"}]},{"id":"moments","show":true,"k":"Together","t":"Little moments","x":"Being with you is always an adventure. Somehow, we never run out of things to do, places to go, activities to try or reasons to laugh. We’ve created so many beautiful memories together, and I wish I could fit every single one into this chapter, but there’s simply not enough space!\n\nOne of my favourite things about us is how much fun we have together. You make me laugh more than I ever thought possible and bring out a side of me that isn’t always so serious. You’ve somehow managed to make this iron woman a little softer, sillier and more playful. 😂❤️\n\nI can’t wait for all the adventures still ahead of us. If there’s one thing I’m certain of, it’s that life with you will never be short of beautiful memories.","m":[{"type":"video","src":"https://res.cloudinary.com/im1cmjhm/video/upload/v1794531083/IMG_5928.mp4","cap":"😍"},{"type":"video","src":"https://res.cloudinary.com/im1cmjhm/video/upload/v1794531271/WhatsApp_Video_2026-11-08_at_12.07.49_AM.mp4","cap":"❤️💕"}]},{"id":"val","show":true,"k":"February","t":"Our first Valentine’s","x":"February wasn’t the easiest month for either of us. We had a lot going on, and perhaps things didn’t go exactly as we had imagined. It wasn’t the elaborate, picture-perfect Valentine’s Day we might have wanted, but we still showed up for each other, made time for us and found little ways to make each other feel loved and appreciated.\n\nI still remember how you struggled to get me the cake and gifts, and honestly, it’s one of the little things that will always stay with me. I love how much effort you put into making things work, how you try, even when things aren’t easy, and how you always find a way to make me feel special.\n\nIt reminded me that love isn’t always about grand gestures, expensive gifts or perfectly planned moments. Sometimes, it’s simply about choosing each other and making an effort, even when life gets a little difficult.\n\nOur first Valentine may not have been everything we pictured, but it was ours, and I wouldn’t trade that memory. ❤️","m":[{"type":"video","src":"assets/videos/IMG_7435.mp4","cap":"Will you be my Valentine??"},{"type":"video","src":"https://res.cloudinary.com/im1cmjhm/video/upload/v1794531056/val1.mp4","cap":"Gift Exchange.."},{"type":"video","src":"assets/videos/val2.MP4","cap":"Gift Exchange.."}]},{"id":"baby","show":false,"k":"Before us","t":"Little us","x":"Baby pictures of you both, before you ever knew each other.","m":[{"type":"image","src":"","cap":"Her, as a baby"},{"type":"image","src":"","cap":"Him, as a baby"}]},{"id":"one","show":true,"k":"Certain","t":"The moment I knew","x":"I don’t know if there was one particular moment when everything clicked, or if it was a collection of all the little things you did. Somewhere between the laughter, the friendship, the effort and the way you loved me, I realised that you were becoming so much more than I ever imagined. You were becoming my favourite person, my safe place and someone I couldn’t imagine doing life without.\n\nAnd this picture? I think it says it all. It captures the chemistry, the connection, the comfort and all the little things that make us us. Sometimes, a picture speaks louder than words, and this one will always remind me of how beautifully we fit together.","m":[{"type":"image","src":"https://ik.imagekit.io/sam10/assets/images/IMG_7440.JPG.jpeg?updatedAt=1794520748703","cap":"Me & You.. never letting go"}]}],"gallery":{"k":"Memories","t":"Our Gallery","items":[{"src":"https://res.cloudinary.com/im1cmjhm/video/upload/v1794531337/gal1.mp4","type":"video"},{"src":"https://res.cloudinary.com/im1cmjhm/video/upload/v1794531156/gal4_1.mp4","type":"video"},{"src":"https://res.cloudinary.com/im1cmjhm/video/upload/v1794531161/gal3.mp4","type":"video"},{"src":"https://ik.imagekit.io/sam10/assets/images/gal5.jpeg?updatedAt=1794520741721","type":"image"},{"src":"https://res.cloudinary.com/im1cmjhm/video/upload/v1794531324/gal5.mp4","type":"video"},{"type":"video","src":"https://res.cloudinary.com/im1cmjhm/video/upload/v1794531000/gal4.mp4"},{"type":"video","src":"https://res.cloudinary.com/im1cmjhm/video/upload/v1794531304/gal6.mp4"},{"type":"video","src":"https://ik.imagekit.io/sam10/assets/videos/gal7.MP4?updatedAt=1794521147386"}]},"letter":{"t":"Babisco,","x":"We met in 100 level and funny enough neither of us had the slightest idea that we were meeting someone who would eventually become such a huge part of our lives.\n\nThe first time I saw you was in the chemistry laboratory during one of our practicals. I approached you first, collected your number and you wrote it in my cute little notebook. I went home, sent you a text and just like that  a friendship began. Little did I know that the boy whose number I had so casually collected would one day mean this much to me.\n\nWe became almost inseparable. From attending lectures together, reading at night classes, sitting beside each other in examination halls, to having sleepovers at my place. You somehow became part of my everyday life without either of us having to make a conscious effort.\n\nAnd when I fell seriously ill, you showed up for me. You were there to help, to check on me and make sure I was okay. Looking back, I realise that even before we understood what we were becoming, you were already showing me what it meant to have someone genuinely care.\n\nOf course, it wasn’t always rosy. We went from being the sweetest best friends to acting like two people who couldn’t stand each other. We fought, argued, became petty and took turns getting on each other’s nerves. Honestly, I sometimes wonder how we survived each other. 😂\n\nBut somewhere between all the arguments, laughter, late-night reading sessions and endless school memories, you became my person.\n\nThen came our final year, and somehow, you found even more ways to make me feel loved. You would drive all the way to my house to pick me up, take me to school, bring me back home, and make sure I had something to eat at every interval. You never made me feel like my needs were an inconvenience. My comfort, my safety and my wellbeing always seemed to matter to you.\n\nAnd that is one thing I will never take for granted about you. You have always had this way of making sure I am okay, sometimes even before I realise I need looking after.\n\nIt’s beautiful to think that what started with a random conversation in a chemistry lab, a phone number in a little notebook and two people who were simply friends has grown into this.\n\nIf someone had told us back then that we’d be celebrating a year of us, I probably would have laughed. Especially considering how much we used to fight. 😂\n\nBut here we are. One year of loving you in a completely different way, discovering new sides of you, creating memories beyond our university days and finding out that my favourite person to annoy could also become my favourite person to love.\n\nThank you for being my friend before being my love. Thank you for showing up, for the little things, the big things and all the in-between moments. Thank you for making me feel considered, cared for and loved.\n\nMost importantly, thank you for making me believe that I can love wholeheartedly and be loved just as deeply in return. You have shown me that love doesn’t always have to be complicated; sometimes, it is in the everyday gestures, the intentionality, the reassurance, the sacrifices and the simple decision to keep showing up for someone.\n\nI pray that I never become too familiar with your love that I forget to appreciate it. I pray that I continue to love you with patience, kindness and grace, and that I never stop choosing you. I want to love you in a way that reflects the depth, selflessness and faithfulness of Christ’s love for His church. A love that is intentional, forgiving, patient and unwavering.\n\nIf I could go back to that chemistry laboratory, I’d still walk up to you, collect your number and send that first text. Only this time, I’d know just how beautiful the story we were about to write would be.\n\nThank you for being one of the sweetest parts of my life. Thank you for being my safe place, my friend, my answered little prayer and the person I get to experience this beautiful thing called love with.\n\nHappy anniversary, my babyboy. \n\nHere’s to all the memories we’ve made, all the versions of ourselves we’ve grown into and all the beautiful years still waiting for us.","s":"I love you 3000. ❤️"},"songs":[{"title":"Find Someone Like You - Snoh Aalegra","url":"  https://ik.imagekit.io/sam10/assets/music/Find%20Someone%20Like%20You%20-%20Snoh%20Aalegra.mp3?updatedAt=1794523496914"},{"title":"Burning Blue - Mariah The Scientist","url":"https://ik.imagekit.io/sam10/assets/music/Burning%20Blue%20-%20Mariah%20The%20Scientist.mp3?updatedAt=1794523496889"},{"title":"Know That You Are Loved - Cleo Sol","url":"https://ik.imagekit.io/sam10/assets/music/Know%20That%20You%20Are%20Loved%20-%20Cleo%20Sol.mp3?updatedAt=1794523496230"},{"title":"Wildfire - Cautious Clay","url":"https://ik.imagekit.io/sam10/assets/music/Wildfire%20-%20Cautious%20Clay.mp3?updatedAt=1794523480649"},{"title":"Rescue - Lauren Daigle","url":"https://ik.imagekit.io/sam10/assets/music/Rescue%20-%20Lauren%20Daigle.mp3?updatedAt=1794523497758"},{"title":"Electric (feat. Khalid) (Ryan Riback Remix) - Alina Baraz","url":"https://ik.imagekit.io/sam10/assets/music/Electric%20(feat.%20Khalid)%20(Ryan%20Riback%20Remix)%20-%20Alina%20Baraz.mp3?updatedAt=1794523500404 "}],"footer":{"t":"Here’s to many more years together"},"welcome":{"a":"Made with love, just for you","btn":"Tap to enter"},"intro":
